name: Security Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate repository layout
        run: |
          test -d app
          test -f app/Dockerfile
          echo "Repository structure is valid"

  sast:
    needs: source-validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Semgrep
        run: pip install --upgrade pip semgrep

      - name: Run Semgrep
        run: |
          semgrep --config auto --error --json --output semgrep.json .

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep.json
          if-no-files-found: ignore

  secrets:
    needs: source-validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source . --no-banner --redact --report-format json --report-path gitleaks.json

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.json
          if-no-files-found: ignore

  trivy-fs:
    needs: source-validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          format: json
          output: trivy-fs.json
          exit-code: "1"

      - name: Upload Trivy FS report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-report
          path: trivy-fs.json
          if-no-files-found: ignore

  iac-scan:
    needs: source-validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov
        run: |
          checkov --directory . --framework dockerfile,kubernetes,terraform --quiet --output json --output-file checkov.json

      - name: Upload Checkov report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-report
          path: checkov.json
          if-no-files-found: ignore

  container-scan:
    needs: source-validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Juice Shop image
        run: docker build -t juice-shop:local ./app

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: image
          image-ref: juice-shop:local
          severity: CRITICAL,HIGH
          format: json
          output: image-trivy.json
          exit-code: "1"

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate SBOM
        run: syft juice-shop:local -o cyclonedx-json=sbom.json

      - name: Upload container reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-reports
          path: |
            image-trivy.json
            sbom.json
          if-no-files-found: ignore

  ai-triage:
    needs:
      - sast
      - secrets
      - trivy-fs
      - iac-scan
      - container-scan
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download security reports
        uses: actions/download-artifact@v4
        with:
          path: security-reports

      - name: Install AI SDK
        run: pip install --upgrade pip openai

      - name: Run AI triage
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python ai-triage/summarize.py --reports-dir security-reports

      - name: Upload AI summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-security-summary
          path: security-report.md
          if-no-files-found: ignore

  policy-gate:
    needs:
      - ai-triage
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download reports and summary
        uses: actions/download-artifact@v4
        with:
          path: final-reports

      - name: Enforce policy thresholds
        run: |
          python ai-triage/policy_gate.py \
            --reports-dir final-reports \
            --summary final-reports/ai-security-summary/security-report.md \
            --max-critical 0 \
            --max-high 3 \
            --max-medium 10

      - name: Publish dashboard artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-dashboard
          path: dashboard/
          if-no-files-found: ignore
