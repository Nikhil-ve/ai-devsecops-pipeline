name: Security Pipeline

on:
  push:
  workflow_dispatch:

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Semgrep
        run: |
          pip install semgrep

      - name: Run Semgrep
        run: |
          semgrep --config auto app/ --json -o semgrep.json

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2

      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: app
          format: json
          output: trivy.json

      - name: Checkov Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .

      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            *.json