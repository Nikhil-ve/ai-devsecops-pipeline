name: Security Pipeline

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  preflight:
    runs-on: ubuntu-latest

    outputs:
      should_scan: ${{ steps.filter.outputs.should_scan }}

    steps:
      - uses: actions/checkout@v4

      - id: filter
        run: |
          echo "should_scan=true" >> "$GITHUB_OUTPUT"

  secrets-scan:
    needs: preflight
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source . --no-banner --redact --report-format sarif --report-path gitleaks.sarif

  sast:
    needs: preflight
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Semgrep
        run: |
          pip install semgrep

      - name: Run Semgrep Gate
        run: |
          semgrep --config auto --json . > semgrep.json || true

          python << 'PY'
          import json

          try:
              with open("semgrep.json", "r") as f:
                  data = json.load(f)
          except Exception:
              print("No Semgrep results produced")
              raise SystemExit(0)

          findings = data.get("results", [])

          critical = sum(
              1 for f in findings
              if str(f.get("extra", {}).get("severity", "")).upper()
              in ["CRITICAL", "ERROR"]
          )

          high = sum(
              1 for f in findings
              if str(f.get("extra", {}).get("severity", "")).upper()
              in ["HIGH", "WARNING"]
          )

          print(f"Critical={critical}")
          print(f"High={high}")

          if critical > 0 or high > 0:
              raise SystemExit(1)
          PY

      - name: Upload Semgrep Report
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep.json

  dependency-scan:
    needs: preflight
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy.json
          severity: HIGH,CRITICAL
          exit-code: 1

      - name: Upload Trivy Report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy.json

  iac-scan:
    needs: preflight
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform,kubernetes,cloudformation,helm
          output_format: cli
          quiet: false
          download_external_modules: true

  image-scan:
    needs:
      - dependency-scan
      - iac-scan

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t juice-shop:v20.3.0 ./app

      - name: Run Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: juice-shop:v20.3.0
          format: json
          output: image-trivy.json
          severity: HIGH,CRITICAL
          exit-code: 1

      - name: Upload Image Scan Report
        uses: actions/upload-artifact@v4
        with:
          name: image-trivy-report
          path: image-trivy.json

  sbom:
    needs: image-scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate SBOM
        run: |
          syft dir:. -o cyclonedx-json=sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

  app-scan:
    needs:
      - image-scan

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create ZAP Output Folder
        run: |
          mkdir -p zap-output

      - name: Run OWASP ZAP Baseline
        run: |
          docker run --rm \
            -v "$PWD/zap-output:/zap/wrk" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t https://demo.testfire.net \
            -r zap-report.html

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap-output

  ai-triage:
    needs:
      - secrets-scan
      - sast
      - dependency-scan
      - iac-scan
      - image-scan
      - sbom
      - app-scan

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai

      - name: Run AI Triage
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python ai-triage/triage.py