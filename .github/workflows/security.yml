name: Security Pipeline

on:
  push:
  workflow_dispatch:

jobs:
  semgrep:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Semgrep
        run: |
          pip install semgrep

      - name: Run Semgrep
        run: |
          semgrep --config auto ./app --json -o semgrep.json

      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep.json