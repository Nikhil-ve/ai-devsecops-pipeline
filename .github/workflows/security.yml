name: Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      should_scan: ${{ steps.filter.outputs.should_scan }}
    steps:
      - uses: actions/checkout@v4

      - id: filter
        run: |
          echo "should_scan=true" >> "$GITHUB_OUTPUT"

  secrets-scan:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source . --no-banner --redact --report-format sarif --report-path gitleaks.sarif
        continue-on-error: false

  sast:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        run: |
          semgrep --config auto --error --json . > semgrep.json || true
          python - <<'PY'
          import json
          try:
              data = json.load(open("semgrep.json"))
          except Exception:
              print("No semgrep results produced")
              raise SystemExit(0)
          findings = data.get("results", [])
          critical = sum(1 for f in findings if f.get("extra", {}).get("severity") in ("ERROR","CRITICAL"))
          high = sum(1 for f in findings if f.get("extra", {}).get("severity") in ("WARNING","HIGH"))
          print(f"semgrep findings: critical={critical} high={high}")
          if critical > 0 or high > 0:
              raise SystemExit(1)
          PY

  dependency-scan:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy.json
          exit-code: 1
          severity: HIGH,CRITICAL

  iac-scan:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform,kubernetes,cloudformation,helm
          output_format: cli
          quiet: false
          download_external_modules: true
        continue-on-error: false

  image-scan:
    needs: [preflight, dependency-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t juice-shop ./app

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: juice-shop
          format: json
          output: image-trivy.json
          exit-code: 1
          severity: HIGH,CRITICAL

  sbom:
    needs: [preflight, image-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Syft
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate SBOM
        run: syft dir:. -o cyclonedx-json=sbom.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

  app-scan:
    needs: [preflight, image-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create ZAP output folder
        run: mkdir -p zap-output

      - name: Run OWASP ZAP baseline
        run: |
          docker run --rm \
            -v "$PWD/zap-output:/zap/wrk" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t https://demo.testfire.net -r zap-report.html || true

      - uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap-output

  ai-triage:
    needs: [secrets-scan, sast, dependency-scan, iac-scan, image-scan, sbom, app-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai

      - name: Run honest triage
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python ai-triage/triage.py
        continue-on-error: false